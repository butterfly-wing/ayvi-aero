# nginx site config for ayvi-aero.dev (static build in /var/www/ayvi-aero/dist).
# Install on the server as /etc/nginx/sites-available/ayvi-aero.

server {
  listen 80;
  listen [::]:80;
  server_name ayvi-aero.dev www.ayvi-aero.dev;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ayvi-aero.dev www.ayvi-aero.dev;

  ssl_certificate     /etc/letsencrypt/live/ayvi-aero.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ayvi-aero.dev/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/ayvi-aero/dist;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always revalidate the page itself, so a new deploy shows up at once.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Build files have a content hash in their name: cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
